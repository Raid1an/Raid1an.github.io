name: Deploy Blog

on:
  push:
    branches:
      - hexo-source

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: hexo-source
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: |
          npx hexo clean
          npx hexo generate

      - name: Deploy to GitHub Pages
        run: |
          cd public
          git init
          git config user.name "Raid1an"
          git config user.email "3243359647@qq.com"
          git add .
          git commit -m "Auto deploy from hexo-source"
          git push -f "https://${{ secrets.GITHUB_TOKEN }}@github.com/Raid1an/Raid1an.github.io.git" main
